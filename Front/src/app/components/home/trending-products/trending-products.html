<!-- Trending Products Section -->
<section class="py-5 bg-white">
  <div class="container">
    <div class="text-center mb-5">
      <span class="badge bg-danger bg-opacity-10 text-danger px-3 py-2 mb-3 fs-6">
      </span>
      <h2 class="display-6 fw-bold">Trending Products</h2>
    </div>

    @if (isLoading) {
      <div class="text-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading products from API...</span>
        </div>
      </div>
    } @else {
      <div class="row g-4 justify-content-center">
        @for (product of trendingProducts; track product._id) {
          <div class="col-sm-6 col-md-4 col-lg">
            <div class="card border-0 shadow-sm h-100 product-card transition-all position-relative rounded-4 overflow-hidden">
              
              <!-- Category Badge -->
              <span class="position-absolute top-0 start-0 m-2 badge bg-primary-subtle text-primary rounded-pill px-2 py-1 small z-1">
                {{ product.category }}
              </span>

              <!-- Image Wrapper -->
              <div class="product-img-wrapper text-center p-3" style="height: 180px; display: flex; align-items: center; justify-content: center;">
                <a [routerLink]="['/product', product._id]" class="text-decoration-none">
                  <img
                    [src]="product.image"
                    [alt]="product.name"
                    class="img-fluid rounded"
                    style="max-height: 150px; object-fit: contain;"
                    (error)="handleImageError($event)"
                  />
                </a>
              </div>

              <!-- Body -->
              <div class="card-body d-flex flex-column p-3">
                <a [routerLink]="['/product', product._id]" class="text-decoration-none text-dark">
                  <h6 class="card-title fw-bold text-truncate mb-2" [title]="product.name">
                    {{ product.name }}
                  </h6>
                </a>

                <div class="mt-auto">
                  <div class="d-flex align-items-center justify-content-between mb-2">
                    <span class="fw-bold text-primary fs-5">${{ product.price.toFixed(2) }}</span>
                  </div>

                  <!-- Simple Add to Cart Button -->
                  <button
                    class="btn btn-primary w-100 btn-sm rounded-pill fw-semibold py-2 d-flex align-items-center justify-content-center gap-1 shadow-sm"
                    (click)="addToCart(product)"
                  >
                    <i class="bi bi-cart-plus fs-6"></i> Add to Cart
                  </button>
                </div>
              </div>

            </div>
          </div>
        }
      </div>
    }
  </div>
</section>
