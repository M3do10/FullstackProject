<!-- Featured Categories Section -->
<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 mb-3 fs-6">

      </span>
      <h2 class="display-6 fw-bold">Explore</h2>
      <p class="text-muted">our most popular categories</p>
    </div>
    <div class="row g-4 justify-content-center">
      <!-- Electronics -->
      <div class="col-6 col-md-4 col-lg">
        <a
          routerLink="/products"
          [queryParams]="{ category: 'Electronics' }"
          class="text-decoration-none"
        >
          <div class="card border-0 shadow-sm text-center p-4 category-card">
            <i class="bi bi-laptop display-4 text-primary mb-3"></i>
            <h6 class="fw-bold text-dark">Electronics</h6>
          </div>
        </a>
      </div>

      <!-- Clothing -->
      <div class="col-6 col-md-4 col-lg">
        <a
          routerLink="/products"
          [queryParams]="{ category: 'Clothing' }"
          class="text-decoration-none"
        >
<div class="card border-0 shadow-sm category-card">
  <div class="card-body d-flex flex-column justify-content-center align-items-center">
    <i class="fa-solid fa-shirt fa-4x text-danger mb-4"></i>
    <h6 class="fw-bold mb-4">Clothing</h6>
  </div>
</div>
        </a>
      </div>

      <!-- Books -->
      <div class="col-6 col-md-4 col-lg">
        <a
          routerLink="/products"
          [queryParams]="{ category: 'Books' }"
          class="text-decoration-none"
        >
          <div class="card border-0 shadow-sm text-center p-4 category-card">
            <i class="bi bi-book display-4 text-info mb-3"></i>
            <h6 class="fw-bold text-dark">Books</h6>
          </div>
        </a>
      </div>

      <!-- Home -->
      <div class="col-6 col-md-4 col-lg">
        <a routerLink="/products" [queryParams]="{ category: 'Home' }" class="text-decoration-none">
          <div class="card border-0 shadow-sm text-center p-4 category-card">
            <i class="bi bi-house-heart display-4 text-success mb-3"></i>
            <h6 class="fw-bold text-dark">Home</h6>
          </div>
        </a>
      </div>

      <!-- Sports -->
      <div class="col-6 col-md-4 col-lg">
        <a
          routerLink="/products"
          [queryParams]="{ category: 'Sports' }"
          class="text-decoration-none"
        >
          <div class="card border-0 shadow-sm text-center p-4 category-card">
            <i class="bi bi-trophy display-4 text-warning mb-3"></i>
            <h6 class="fw-bold text-dark">Sports</h6>
          </div>
        </a>
      </div>
    </div>
  </div>
</section>
