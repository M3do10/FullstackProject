<!-- Login Page -->
<section class="login-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

          <!-- Card Header -->
          <div class="card-header bg-primary text-white text-center py-4 border-0">
            <i class="bi bi-box-arrow-in-right display-5 mb-2"></i>
            <h3 class="fw-bold mb-1">Welcome</h3>
            <p class="mb-0 text-white-50 small">Login to your account</p>
          </div>

          <div class="card-body p-4 p-md-5">

            @if (errorMessage) {
              <div class="alert alert-danger d-flex align-items-start gap-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill fs-5 mt-1"></i>
                <div>{{ errorMessage }}</div>
              </div>
            }

            <form (ngSubmit)="onSubmit()">
              <!-- Email -->
              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold">
                  <i class="bi bi-envelope me-1"></i> Email Address
                </label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="loginEmail"
                  placeholder="Enter your email"
                  [(ngModel)]="email"
                  name="email"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="loginPassword" class="form-label fw-semibold">
                  <i class="bi bi-lock me-1"></i> Password
                </label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  id="loginPassword"
                  placeholder="Enter your password"
                  [(ngModel)]="password"
                  name="password"
                  required
                />
              </div>

              <button
                type="submit"
                class="btn btn-primary btn-lg w-100 fw-semibold"
                [disabled]="isLoading"
              >
                @if (isLoading) {
                  <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Logging in...
                } @else {
                  <i class="bi bi-box-arrow-in-right me-2"></i> Login
                }
              </button>
            </form>
          </div>

          <div class="card-footer bg-light text-center py-3 border-0">
            <span class="text-muted">Don't have an account?</span>
            <a routerLink="/register" class="text-primary fw-semibold text-decoration-none ms-1">Sign Up</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
